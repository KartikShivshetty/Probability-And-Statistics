<script>
const dot = document.getElementById("cursorDot");
const ring = document.getElementById("cursorRing");
const hoverTargets = document.querySelectorAll("a, button, .panel, .brand, .nav li");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let ringX = mouseX;
let ringY = mouseY;

window.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    dot.style.left = mouseX + "px";
    dot.style.top = mouseY + "px";
});

hoverTargets.forEach((el) => {
    el.addEventListener("mouseenter", () => {
        ring.style.width = "36px";
        ring.style.height = "36px";
        ring.style.borderColor = "rgba(241,235,87,1)";
    });
    el.addEventListener("mouseleave", () => {
        ring.style.width = "28px";
        ring.style.height = "28px";
        ring.style.borderColor = "rgba(241,235,87,0.7)";
    });
});

function animateRing() {
    ringX += (mouseX - ringX) * 0.16;
    ringY += (mouseY - ringY) * 0.16;
    ring.style.left = ringX + "px";
    ring.style.top = ringY + "px";
    requestAnimationFrame(animateRing);
}

animateRing();
</script>

  tx = x;
  ty = y;
  if(target && target.closest){
    setCursorHover(!!target.closest('a,button,[role=\"button\"],input,select,textarea,.tab-btn,.brand-btn'));
  }
}

function startCursorLoop(){
  if(cursorLoopStarted || !cursorChip){ return; }
  cursorLoopStarted = true;
  function tick(){
    lx += (tx - lx) * 0.22;
    ly += (ty - ly) * 0.22;
    cursorChip.style.left = lx + 'px';
    cursorChip.style.top = ly + 'px';
    requestAnimationFrame(tick);
  }
  tick();
}

function setupGlobalCursor(){
  if(!finePointer || cursorChip){ return; }
  const style = document.createElement('style');
  style.id = 'global-cursor-style';
  style.textContent = `
    html,body,*{cursor:none !important;}
    .global-cursor-chip{
      position:fixed;
      left:0;
      top:0;
      transform:translate(-50%,-50%);
      pointer-events:none;
      z-index:2147483647;
      width:12px;
      height:12px;
      border-radius:4px;
      border:1.6px solid rgba(98,245,216,0.9);
      background:rgba(98,245,216,0.08);
      box-shadow:0 0 0 1px rgba(0,0,0,0.66), 0 0 0 2px rgba(255,255,255,0.55), 0 0 11px rgba(98,245,216,0.30);
      opacity:.88;
      transition:width .14s ease,height .14s ease,opacity .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease;
      will-change:left,top;
    }
  `;
  document.head.appendChild(style);

  cursorChip = document.createElement('div');
  cursorChip.className = 'global-cursor-chip';
  document.body.appendChild(cursorChip);

  document.addEventListener('mousemove', (e) => {
    updateCursorPosition(e.clientX, e.clientY, e.target);
  }, {passive:true});
  document.addEventListener('mouseleave', () => {
    if(cursorChip){ cursorChip.style.opacity = '0.25'; }
  }, {passive:true});
  document.addEventListener('mouseenter', () => {
    if(cursorChip){ cursorChip.style.opacity = hoverActive ? '1' : '0.88'; }
  }, {passive:true});

  startCursorLoop();
}

function applySimpleCursorToFrame(){
  if(!finePointer){ return; }
  const doc = viewer.contentDocument;
  if(!doc || !doc.body){ return; }

  const oldDot = doc.getElementById('cursorDot');
  const oldRing = doc.getElementById('cursorRing');
  if(oldDot) oldDot.remove();
  if(oldRing) oldRing.remove();
  doc.querySelectorAll('.cursor-dot,.cursor-ring,.p-cursor-dot,.p-cursor-ring,.global-cursor-dot,.global-cursor-ring,.global-cursor-line,.global-cursor-chip').forEach(el=>el.remove());

  const prevStyle = doc.getElementById('frame-cursor-style');
  if(prevStyle) prevStyle.remove();
  const frameStyle = doc.createElement('style');
  frameStyle.id = 'frame-cursor-style';
  frameStyle.textContent = `
    html,body,*{cursor:none !important;}
    #cursorDot,#cursorRing,.cursor-dot,.cursor-ring,.p-cursor-dot,.p-cursor-ring{display:none !important;}
    :is(.card,.concept,.app,.member,.skill,.formula-card,.step,.chart-box,.summary,.table-box){
      transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease,background-color .24s ease !important;
      will-change:transform;
    }
    :is(.card,.concept,.app,.member,.skill,.formula-card,.step,.chart-box,.summary,.table-box):hover{
      transform:translateY(-4px) !important;
      border-color:rgba(241,235,87,0.38) !important;
      box-shadow:0 10px 24px rgba(0,0,0,0.26), 0 0 0 1px rgba(241,235,87,0.10) inset !important;
    }
  `;
  doc.head.appendChild(frameStyle);

  doc.addEventListener('mousemove', (e) => {
    const rect = viewer.getBoundingClientRect();
    updateCursorPosition(rect.left + e.clientX, rect.top + e.clientY, e.target);
  }, {passive:true});
  doc.addEventListener('mouseleave', () => {
    if(cursorChip){
      cursorChip.style.opacity = '0.25';
      setCursorHover(false);
    }
  }, {passive:true});
  doc.addEventListener('mouseenter', () => {
    if(cursorChip){ cursorChip.style.opacity = hoverActive ? '1' : '0.88'; }
  }, {passive:true});
}

function loadPage(id){
  const tpl=document.getElementById('page-'+id);
  if(!tpl)return;
  const doc = viewer.contentDocument || viewer.contentWindow.document;
  doc.open();
  doc.write(tpl.innerHTML);
  doc.close();
  setTimeout(applySimpleCursorToFrame,0);
  setActive(id);
}
setupGlobalCursor();
buttons.forEach(btn=>btn.addEventListener('click',()=>loadPage(btn.dataset.page)));
if(homeBtn){homeBtn.addEventListener('click',()=>loadPage('introduction'));}
loadPage('introduction');
</script>
